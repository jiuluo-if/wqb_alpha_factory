[[templates]]
id = "toy_control_rank"
version = "2"
role = "CONTROL_ALPHA"
kind = "baseline"
family = "toy_control"
semantic_contract = "SYNTHETIC_FIXTURE"
expression = "rank({p})"
required_slots = ["p"]
economic_mechanism = "TOY synthetic control for cross-sectional ordering."
