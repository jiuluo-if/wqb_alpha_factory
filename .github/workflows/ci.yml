name: Alpha Factory CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -c constraints/ci-py311.txt ".[dev]"
      - name: Syntax layer
        run: python -m compileall -q wqb_agent scripts tests
      - name: Type layer
        run: >-
          python -m mypy
          wqb_agent/config.py
          wqb_agent/runtime_policy.py
          wqb_agent/runtime_components.py
          wqb_agent/runtime_composition.py
          wqb_agent/credentials.py
          wqb_agent/suggestion_workflow.py
          wqb_agent/alpha_feed_workflow.py
          wqb_agent/optimizer_workflow.py
      - name: Ruff
        run: python -m ruff check .
      - name: Targeted Fast Lane
        env:
          TARGET_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/run_targeted_tests.py --base-sha "$TARGET_BASE_SHA"
      - name: Whole-repository final gate
        run: python -m unittest discover -s tests
      - name: Offline doctor
        run: python main.py --state-dir tests/fixtures state doctor
      - name: Offline state audit
        run: python main.py --state-dir tests/fixtures state audit
      - name: Privacy
        run: python scripts/check_repo_privacy.py
