name: Alpha Factory CI

on:
  push:
    branches: ["v0.2", "main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: alpha-factory-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -c constraints/ci-py311.txt ".[dev]"
      - name: Syntax layer
        run: python -m compileall -q wqb_agent scripts tests
      - name: Type layer
        run: >-
          python -m mypy
          wqb_agent/config.py
          wqb_agent/research_api.py
          wqb_agent/credentials.py
      - name: Ruff
        run: python -m ruff check .
      - name: Targeted Fast Lane
        env:
          TARGET_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$TARGET_BASE_SHA" ] || [[ "$TARGET_BASE_SHA" =~ ^0+$ ]]; then
            TARGET_BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          python scripts/run_targeted_tests.py --base-sha "$TARGET_BASE_SHA"
      - name: Whole-repository final gate
        run: python -m unittest discover -s tests
      - name: Offline doctor
        run: python main.py --state-dir tests/fixtures diagnostics doctor --offline
      - name: Offline execution audit
        run: python main.py --state-dir tests/fixtures diagnostics audit --offline
      - name: Privacy
        run: python scripts/check_repo_privacy.py
