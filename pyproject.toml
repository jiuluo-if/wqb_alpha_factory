[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-factory"
version = "0.8.0"
description = "Safety-first, state-driven Alpha research factory"
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["ruff", "coverage", "mypy"]
perf = ["py-spy", "pytest", "pytest-xdist"]

[tool.coverage.run]
branch = true
source = ["wqb_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 76.0

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
follow_imports = "skip"

[tool.setuptools.packages.find]
include = ["wqb_agent*"]

[tool.setuptools.package-data]
"wqb_agent.alpha_templates" = ["catalog/*.toml"]
"wqb_agent.reference" = ["*.md"]

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", "I",
  "UP009", "UP012", "UP017", "UP031", "UP035", "UP037",
  "B007", "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E741", "F401", "F821", "F841"]
